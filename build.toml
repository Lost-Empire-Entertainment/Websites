[project]
name="website-backend"
version="0-0-1"
kmake="project.kmake"

[references]
dir_kh="../../cpp/kalaheaders"
dir_ks="../../cpp/kalaserver/build/0-0-1"
ext_kh="external/kalaheaders"
ext_ks="external/kalaserver"

[windows-sync]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]
ks_stuff=[ "${dir_ks}", "${ext_ks}", "copy" ]
ks_junk=[ "${ext_ks}/kalaheaders", "", "delete" ]

[windows-post-build-sync]
wb_bin_rel=[ "build/temp/release-windows/website-backend.exe", "build/${version}/website-backend-windows.exe", "copy" ]
wb_bin_deb=[ "build/temp/debug-windows/website-backend.exe", "build/${version}/website-backend-windowsd.exe", "copy" ]
wb_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
wb_readme=[ "README.md", "build/${version}/README.md", "copy" ]
wb_content=[ "content", "build/${version}/content", "copy" ]

[linux-sync]
kh_license=[ "${dir_kh}/LICENSE.md", "${ext_kh}/LICENSE.md", "copy" ]
kh_readme=[ "${dir_kh}/README.md", "${ext_kh}/README.md", "copy" ]
kh_include=[ "${dir_kh}/include", "${ext_kh}/include", "copy" ]
ks_stuff=[ "${dir_ks}", "${ext_ks}", "copy" ]
ks_junk=[ "${ext_ks}/kalaheaders", "", "delete" ]

[linux-post-build-sync]
wb_bin_rel=[ "build/temp/release-linux/website-backend", "build/${version}/website-backend-linux", "copy" ]
wb_bin_deb=[ "build/temp/debug-linux/website-backend", "build/${version}/website-backend-linuxd", "copy" ]
wb_license=[ "LICENSE.md", "build/${version}/LICENSE.md", "copy" ]
wb_readme=[ "README.md", "build/${version}/README.md", "copy" ]
wb_content=[ "content", "build/${version}/content", "copy" ]
